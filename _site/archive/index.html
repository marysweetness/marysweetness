<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.9);
        cursor: pointer;
      }
      .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 90%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .clickable {
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .clickable:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main class="center">
      <div style="max-width:900px; padding:24px; display:flex; flex-direction:column; min-height:calc(100vh - 48px);">
        <div style="flex:1">
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:40px;">
            <img src="/assets/makeover.jpg" alt="Makeover" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(this.src)" />
            <img src="/assets/recess.png" alt="Recess" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(this.src)" />
            <img src="/assets/library.png" alt="Library" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(this.src)" />
          </div>
        </div>
        <nav class="stack" style="margin-top:auto; margin-bottom:18px;">
          <a class="button button--red" href="/">← back home</a>
        </nav>
      </div>
    </main>
    <div id="imageModal" class="modal" onclick="closeModal()">
      <img class="modal-content" id="modalImage">
    </div>
    <script>
      function openModal(src) {
        document.getElementById('imageModal').style.display = 'block';
        document.getElementById('modalImage').src = src;
      }
      function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
      }
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });
    </script>
  </body>
</html>
