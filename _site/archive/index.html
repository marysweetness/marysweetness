<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="center">
      <div style="max-width:900px; padding:24px; display:flex; flex-direction:column; min-height:calc(100vh - 48px);">
        <div style="flex:1">
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:40px;">
            <img src="makeover.jpg" alt="Makeover" style="width:100%; height:auto; border-radius:8px;" />
            <img src="recess.png" alt="Recess" style="width:100%; height:auto; border-radius:8px;" />
            <img src="library.png" alt="Library" style="width:100%; height:auto; border-radius:8px;" />
          </div>
        </div>
        <nav class="stack" style="margin-top:auto; margin-bottom:18px;">
          <a class="button button--red" href="/">← back home</a>
        </nav>
      </div>
    </main>
  </body>
</html>
