<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.9);
        cursor: pointer;
      }
      .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 90%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .clickable {
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .clickable:hover {
        opacity: 0.8;
      }
      .puzzle-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        grid-auto-rows: 150px;
        gap: 8px;
        margin-top: 40px;
      }
      .puzzle-grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .puzzle-grid img:nth-child(1) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(2) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(3) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(4) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(5) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(6) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(7) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(8) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(9) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(10) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(11) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(12) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(13) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(14) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(15) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(16) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(17) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(18) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(19) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(20) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(21) { grid-column: span 2; grid-row: span 2; }
      .puzzle-grid img:nth-child(22) { grid-column: span 1; grid-row: span 1; }
      .puzzle-grid img:nth-child(23) { grid-column: span 1; grid-row: span 2; }
      .puzzle-grid img:nth-child(24) { grid-column: span 2; grid-row: span 1; }
    </style>
  </head>
  <body>
    <main class="center">
      <div style="max-width:1200px; padding:24px; display:flex; flex-direction:column; min-height:calc(100vh - 48px);">
        <div style="flex:1; position:relative; min-height:2200px;">
          <div style="position:relative; width:100%; height:100%;">
            <img src="/assets/Dec 2006 012.jpg" alt="Dec 2006 012" class="clickable" style="position:absolute; width:220px; top:50px; left:5%; transform:rotate(-8deg);" onclick="openModal(0)" />
            <img src="/assets/fishing.jpg" alt="fishing" class="clickable" style="position:absolute; width:280px; top:80px; right:5%; transform:rotate(5deg);" onclick="openModal(1)" />
            <img src="/assets/June 2006 009.jpg" alt="June 2006 009" class="clickable" style="position:absolute; width:200px; top:380px; left:8%; transform:rotate(12deg);" onclick="openModal(2)" />
            <img src="/assets/makeover.jpg" alt="Makeover" class="clickable" style="position:absolute; width:240px; top:250px; left:38%; transform:rotate(-3deg);" onclick="openModal(3)" />
            <img src="/assets/381.PNG" alt="381" class="clickable" style="position:absolute; width:190px; top:550px; right:12%; transform:rotate(-15deg);" onclick="openModal(4)" />
            <img src="/assets/May Part B 2007 092.jpg" alt="May Part B 2007 092" class="clickable" style="position:absolute; width:260px; top:720px; left:6%; transform:rotate(7deg);" onclick="openModal(5)" />
            <img src="/assets/library.png" alt="Library" class="clickable" style="position:absolute; width:210px; top:450px; left:52%; transform:rotate(-6deg);" onclick="openModal(6)" />
            <img src="/assets/008.JPG" alt="008" class="clickable" style="position:absolute; width:230px; top:880px; right:22%; transform:rotate(10deg);" onclick="openModal(7)" />
            <img src="/assets/May 2006 mk 1st comm 002.jpg" alt="May 2006 mk 1st comm 002" class="clickable" style="position:absolute; width:250px; top:1080px; left:12%; transform:rotate(-12deg);" onclick="openModal(8)" />
            <img src="/assets/Azela Garden and Jed Coming Home May 4 020.jpg" alt="Azela Garden and Jed Coming Home May 4 020" class="clickable" style="position:absolute; width:200px; top:1250px; right:18%; transform:rotate(4deg);" onclick="openModal(9)" />
            <img src="/assets/recess.png" alt="Recess" class="clickable" style="position:absolute; width:270px; top:1420px; left:28%; transform:rotate(-9deg);" onclick="openModal(10)" />
            <img src="/assets/May Part B 2007 094.jpg" alt="May Part B 2007 094" class="clickable" style="position:absolute; width:220px; top:1640px; right:8%; transform:rotate(13deg);" onclick="openModal(11)" />
            <img src="/assets/April 2007 020.jpg" alt="April 2007 020" class="clickable" style="position:absolute; width:240px; top:1850px; left:18%; transform:rotate(-5deg);" onclick="openModal(12)" />
          </div>
        </div>
        <nav class="stack" style="margin-top:auto; margin-bottom:18px;">
          <a class="button button--red" href="/">← back home</a>
        </nav>
      </div>
    </main>
    <div id="imageModal" class="modal" onclick="closeModal()">
      <img class="modal-content" id="modalImage">
    </div>
    <script>
      const images = [
        '/assets/Dec 2006 012.jpg',
        '/assets/fishing.jpg',
        '/assets/June 2006 009.jpg',
        '/assets/makeover.jpg',
        '/assets/381.PNG',
        '/assets/May Part B 2007 092.jpg',
        '/assets/library.png',
        '/assets/008.JPG',
        '/assets/May 2006 mk 1st comm 002.jpg',
        '/assets/Azela Garden and Jed Coming Home May 4 020.jpg',
        '/assets/recess.png',
        '/assets/May Part B 2007 094.jpg',
        '/assets/April 2007 020.jpg'
      ];
      let currentIndex = 0;
      
      function openModal(index) {
        currentIndex = index;
        document.getElementById('imageModal').style.display = 'block';
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
      }
      
      function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      document.addEventListener('keydown', function(e) {
        if (document.getElementById('imageModal').style.display === 'block') {
          if (e.key === 'Escape') {
            closeModal();
          } else if (e.key === 'ArrowRight') {
            nextImage();
          } else if (e.key === 'ArrowLeft') {
            prevImage();
          }
        }
      });
    </script>
  </body>
</html>
