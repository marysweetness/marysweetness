<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.9);
        cursor: pointer;
      }
      .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 90%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .clickable {
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .clickable:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main class="center">
      <div style="max-width:900px; padding:24px; display:flex; flex-direction:column; min-height:calc(100vh - 48px);">
        <div style="flex:1">
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:40px;">
            <img src="/assets/makeover.jpg" alt="Makeover" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(0)" />
            <img src="/assets/recess.png" alt="Recess" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(1)" />
            <img src="/assets/library.png" alt="Library" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(2)" />
            <img src="/assets/008.JPG" alt="008" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(3)" />
            <img src="/assets/106.JPG" alt="106" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(4)" />
            <img src="/assets/381.PNG" alt="381" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(5)" />
            <img src="/assets/April 2007 020.jpg" alt="April 2007 020" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(6)" />
            <img src="/assets/Aug Pics 2 2006 010.jpg" alt="Aug Pics 2 2006 010" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(7)" />
            <img src="/assets/Azela Garden and Jed Coming Home May 4 020.jpg" alt="Azela Garden and Jed Coming Home May 4 020" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(8)" />
            <img src="/assets/Dec 2006 007.jpg" alt="Dec 2006 007" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(9)" />
            <img src="/assets/Dec 2006 012.jpg" alt="Dec 2006 012" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(10)" />
            <img src="/assets/Jan 2006 003.jpg" alt="Jan 2006 003" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(11)" />
            <img src="/assets/Jan 2006 004.jpg" alt="Jan 2006 004" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(12)" />
            <img src="/assets/June 2006 009.jpg" alt="June 2006 009" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(13)" />
            <img src="/assets/Kari & Elizabeth BD 2005 016.jpg" alt="Kari & Elizabeth BD 2005 016" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(14)" />
            <img src="/assets/May 2006 mk 1st comm 002.jpg" alt="May 2006 mk 1st comm 002" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(15)" />
            <img src="/assets/May Part B 2007 092.jpg" alt="May Part B 2007 092" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(16)" />
            <img src="/assets/May Part B 2007 094.jpg" alt="May Part B 2007 094" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(17)" />
            <img src="/assets/ear1.jpg" alt="ear1" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(18)" />
            <img src="/assets/ear2.jpg" alt="ear2" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(19)" />

            <img src="/assets/oct312007 006.jpg" alt="oct312007 006" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(21)" />

            <img src="/assets/summer fun in NC vacation 2005 011.jpg" alt="summer fun in NC vacation 2005 011" class="clickable" style="width:100%; height:auto; border-radius:8px;" onclick="openModal(23)" />
          </div>
        </div>
        <nav class="stack" style="margin-top:auto; margin-bottom:18px;">
          <a class="button button--red" href="/">← back home</a>
        </nav>
      </div>
    </main>
    <div id="imageModal" class="modal" onclick="closeModal()">
      <img class="modal-content" id="modalImage">
    </div>
    <script>
      const images = [
        '/assets/makeover.jpg',
        '/assets/recess.png',
        '/assets/library.png',
        '/assets/008.JPG',
        '/assets/106.JPG',
        '/assets/381.PNG',
        '/assets/April 2007 020.jpg',
        '/assets/Aug Pics 2 2006 010.jpg',
        '/assets/Azela Garden and Jed Coming Home May 4 020.jpg',
        '/assets/Dec 2006 007.jpg',
        '/assets/Dec 2006 012.jpg',
        '/assets/Jan 2006 003.jpg',
        '/assets/Jan 2006 004.jpg',
        '/assets/June 2006 009.jpg',
        '/assets/Kari & Elizabeth BD 2005 016.jpg',
        '/assets/May 2006 mk 1st comm 002.jpg',
        '/assets/May Part B 2007 092.jpg',
        '/assets/May Part B 2007 094.jpg',
        '/assets/ear1.jpg',
        '/assets/ear2.jpg',
        '/assets/fishing.jpg',
        '/assets/oct312007 006.jpg',
        '/assets/oct312007 009.jpg',
        '/assets/summer fun in NC vacation 2005 011.jpg'
      ];
      let currentIndex = 0;
      
      function openModal(index) {
        currentIndex = index;
        document.getElementById('imageModal').style.display = 'block';
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
      }
      
      function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      document.addEventListener('keydown', function(e) {
        if (document.getElementById('imageModal').style.display === 'block') {
          if (e.key === 'Escape') {
            closeModal();
          } else if (e.key === 'ArrowRight') {
            nextImage();
          } else if (e.key === 'ArrowLeft') {
            prevImage();
          }
        }
      });
    </script>
  </body>
</html>
