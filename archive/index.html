<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .three-column-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        width: 100vw;
        min-height: 100vh;
      }
      .three-column-grid img {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .three-column-grid img:hover {
        opacity: 0.8;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.9);
        cursor: pointer;
      }
      .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 90%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .back-button {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div class="three-column-grid">
      <img src="/assets/Dec 2006 012.jpg" alt="Dec 2006 012" onclick="openModal(0)" />
      <img src="/assets/fishing.jpg" alt="fishing" onclick="openModal(1)" />
      <img src="/assets/June 2006 009.jpg" alt="June 2006 009" onclick="openModal(2)" />
      <img src="/assets/makeover.jpg" alt="Makeover" onclick="openModal(3)" />
      <img src="/assets/381.PNG" alt="381" onclick="openModal(4)" />
      <img src="/assets/May Part B 2007 092.jpg" alt="May Part B 2007 092" onclick="openModal(5)" />
      <img src="/assets/library.png" alt="Library" onclick="openModal(6)" />
      <img src="/assets/008.JPG" alt="008" onclick="openModal(7)" />
      <img src="/assets/May 2006 mk 1st comm 002.jpg" alt="May 2006 mk 1st comm 002" onclick="openModal(8)" />
      <img src="/assets/Azela Garden and Jed Coming Home May 4 020.jpg" alt="Azela Garden and Jed Coming Home May 4 020" onclick="openModal(9)" />
      <img src="/assets/recess.png" alt="Recess" onclick="openModal(10)" />
      <img src="/assets/May Part B 2007 094.jpg" alt="May Part B 2007 094" onclick="openModal(11)" />
      <img src="/assets/April 2007 020.jpg" alt="April 2007 020" onclick="openModal(12)" />
    </div>
    <nav class="back-button">
      <a class="button button--red" href="/">← back home</a>
    </nav>
    <div id="imageModal" class="modal" onclick="closeModal()">
      <img class="modal-content" id="modalImage">
    </div>
    <script>
      const images = [
        '/assets/Dec 2006 012.jpg',
        '/assets/fishing.jpg',
        '/assets/June 2006 009.jpg',
        '/assets/makeover.jpg',
        '/assets/381.PNG',
        '/assets/May Part B 2007 092.jpg',
        '/assets/library.png',
        '/assets/008.JPG',
        '/assets/May 2006 mk 1st comm 002.jpg',
        '/assets/Azela Garden and Jed Coming Home May 4 020.jpg',
        '/assets/recess.png',
        '/assets/May Part B 2007 094.jpg',
        '/assets/April 2007 020.jpg'
      ];
      let currentIndex = 0;
      
      function openModal(index) {
        currentIndex = index;
        document.getElementById('imageModal').style.display = 'block';
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
      }
      
      function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        document.getElementById('modalImage').src = images[currentIndex];
      }
      
      document.addEventListener('keydown', function(e) {
        if (document.getElementById('imageModal').style.display === 'block') {
          if (e.key === 'Escape') {
            closeModal();
          } else if (e.key === 'ArrowRight') {
            nextImage();
          } else if (e.key === 'ArrowLeft') {
            prevImage();
          }
        }
      });
    </script>
  </body>
</html>
