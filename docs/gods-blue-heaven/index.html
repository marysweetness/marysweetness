    <style>
      body {
        background: #09084A !important;
        min-height: 500vh;
        overflow-x: hidden;
      }

      .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 500vh;
        pointer-events: none;
      }

      .shooting-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 10px 4px #ffffff, 0 0 20px 6px rgba(255, 255, 255, 0.6), 0 0 30px 8px rgba(255, 255, 255, 0.3);
        filter: blur(0.2px);
      }

      .shooting-star::before {
        content: '';
        position: absolute;
        top: -6px;
        right: 4px;
        height: 16px;
        width: 280px;
        background: linear-gradient(90deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 15%, rgba(255, 255, 255, 0.5) 35%, rgba(255, 255, 255, 0.2) 60%, transparent 100%);
        opacity: 0.9;
        border-radius: 0 50% 50% 0;
        filter: blur(0.8px);
      }

      .shoot-down-right {
        animation: shootDownRight 3s ease-out infinite;
      }
      .shoot-down-right::before {
        transform: rotate(45deg);
        transform-origin: 0% 50%;
      }

      .shoot-down-left {
        animation: shootDownLeft 3s ease-out infinite;
      }
      .shoot-down-left::before {
        transform: rotate(135deg);
        transform-origin: 0% 50%;
      }

      .shoot-up-right {
        animation: shootUpRight 3s ease-out infinite;
      }
      .shoot-up-right::before {
        transform: rotate(-45deg);
        transform-origin: 0% 50%;
      }

      .shoot-up-left {
        animation: shootUpLeft 3s ease-out infinite;
      }
      .shoot-up-left::before {
        transform: rotate(-135deg);
        transform-origin: 0% 50%;
      }

      @keyframes shootDownRight {
        0% {
          opacity: 0;
          transform: translateX(0) translateY(0);
        }
        5% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(400px) translateY(400px);
        }
      }

      @keyframes shootDownLeft {
        0% {
          opacity: 0;
          transform: translateX(0) translateY(0);
        }
        5% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(-400px) translateY(400px);
        }
      }

      @keyframes shootUpRight {
        0% {
          opacity: 0;
          transform: translateX(0) translateY(0);
        }
        5% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(400px) translateY(-400px);
        }
      }

      @keyframes shootUpLeft {
        0% {
          opacity: 0;
          transform: translateX(0) translateY(0);
        }
        5% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(-400px) translateY(-400px);
        }
      }
