<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>

          <a class="folder" href="/photos/theirs/friends/">

          <a class="folder" href="/photos/theirs/strangers/">
            <div class="folder-box" aria-hidden></div>
            <div class="folder-label">Strangers</div>
          </a>
        </div>

        <nav class="stack" style="margin-top:18px;">
          <a class="button" href="/photos/">← back to photos</a>
        </nav>
      </div>

</html>
