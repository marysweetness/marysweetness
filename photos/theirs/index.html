<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photos By Others — Mary Sweetness</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="center">
      <div class="title" data-text="Photos By Others">Photos By Others</div>
      <div class="subtitle">photos taken by friends, collaborators, and archives</div>

      <nav class="stack">
        <a class="button" href="/photos/">← back to photos</a>
      </nav>

      <div style="max-width:900px; padding:24px;">
        <p>Choose a collection:</p>

        <div class="folder-grid">
          <a class="folder" href="/photos/theirs/family/">
            <div class="folder-box" aria-hidden></div>
            <div class="folder-label">Family</div>
          </a>

          <a class="folder" href="/photos/theirs/friends/">
            <div class="folder-box" aria-hidden></div>
            <div class="folder-label">Friends</div>
          </a>

          <a class="folder" href="/photos/theirs/strangers/">
            <div class="folder-box" aria-hidden></div>
            <div class="folder-label">Strangers</div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
